[project]
name = "studio-cms"
version = "0.1.0"
description = "Studio CMS de VF Digital (etapa 1: Studio de uso personal)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "flask-limiter[redis]>=3.12",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "nh3>=0.2",
    "jsonschema>=4.23",
    "rq>=2.1",
    "redis>=5.2",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
